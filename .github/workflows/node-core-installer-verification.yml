name: Direct Node Core Installer Verification

on:
  push:
    branches: [main, installer-direct]
    paths:
      - "Installer/**"
      - "Node Core/**"
      - ".github/workflows/node-core-installer-verification.yml"
  pull_request:
    paths:
      - "Installer/**"
      - "Node Core/**"
      - ".github/workflows/node-core-installer-verification.yml"
  workflow_dispatch:

jobs:
  installer-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Node Core cryptography dependency
        run: python -m pip install --disable-pip-version-check -r "Node Core/Cryptography/requirements.txt"

      - name: Compile installer and Node Core
        run: |
          python -m py_compile Installer/install.py
          python -m compileall -q "Node Core"

      - name: Test direct installer from current branch
        run: |
          rm -rf /tmp/cpg-direct-installer-test
          python Installer/install.py             --ref "${GITHUB_REF_NAME}"             --target /tmp/cpg-direct-installer-test

      - name: Verify installed Node Core
        run: |
          python "Node Core/Tools/Validation/verify_node_installation.py" /tmp/cpg-direct-installer-test
          python "Node Core/Tools/Validation/verify_storage_coherence.py" /tmp/cpg-direct-installer-test
          python "Node Core/Tools/Validation/validate_installation_manifest_schema.py" /tmp/cpg-direct-installer-test

      - name: Test existing-installation protection
        run: |
          if python Installer/install.py             --ref "${GITHUB_REF_NAME}"             --target /tmp/cpg-direct-installer-test
          then
            echo "Installer incorrectly overwrote an existing installation"
            exit 1
          fi
