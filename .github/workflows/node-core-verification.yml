name: Node Core Verification

on:
  push:
    branches: [main]
    paths:
      - "Node Core/**"
      - "scripts/node_core_audit.py"
      - ".github/workflows/node-core-verification.yml"
      - ".devcontainer/**"
  pull_request:
    paths:
      - "Node Core/**"
      - "scripts/node_core_audit.py"
      - ".github/workflows/node-core-verification.yml"
      - ".devcontainer/**"
  workflow_dispatch:

jobs:
  node-core-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cryptography dependency
        run: python -m pip install --disable-pip-version-check -r "Node Core/Cryptography/requirements.txt"

      - name: Run Node Core structural audit
        run: python scripts/node_core_audit.py

      - name: Compile Node Core Python sources
        run: |
          python -m compileall -q "Node Core"

      - name: Run Node Core verification tests
        run: python -m unittest discover -s "Node Core/Tests/Verification" -p "test_*.py" -v

      - name: Run Node Core installation manifest test
        run: python "Node Core/Tests/Integration/test_installation_manifest.py"

      - name: Run Node Core end-to-end test
        run: python "Node Core/Tests/Integration/test_node_installation_e2e.py"

      - name: Run Node Core final audit
        run: python "Node Core/Tools/Validation/final_node_core_audit.py"
