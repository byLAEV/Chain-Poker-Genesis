name: CPG Node Installation Baseline Validation
# Full Node Core policy/reliability validation gate.
# Replication policy baseline is validated before advancing FN-024.

on:
  workflow_dispatch:
  push:
    paths:
      - "docs/node/**"
      - "reference-implementation/node-installation/**"
      - "tests/node-installation/**"
      - ".github/workflows/node-installation-validation.yml"
  pull_request:
    paths:
      - "docs/node/**"
      - "reference-implementation/node-installation/**"
      - "tests/node-installation/**"
      - ".github/workflows/node-installation-validation.yml"

jobs:
  verify-node-installation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Bootstrap clean Node Core
        run: |
          python reference-implementation/node-installation/bootstrap_node.py /tmp/cpg-node-test

      - name: Verify Node Core
        run: |
          python reference-implementation/node-installation/verify_node_installation.py /tmp/cpg-node-test

      - name: Verify Node Core runtime lifecycle
        run: |
          cd reference-implementation/node-installation
          python test_runtime_lifecycle.py

      - name: Verify Health and Recovery
        run: |
          cd reference-implementation/node-installation
          python test_health_recovery.py

      - name: Verify End-to-End Node Installation
        run: |
          cd reference-implementation/node-installation
          python test_node_installation_e2e.py

      - name: Verify canonical Installation Manifest
        run: |
          cd reference-implementation/node-installation
          python test_installation_manifest.py

      - name: Run Final Node Core Audit
        run: |
          cd reference-implementation/node-installation
          python final_node_core_audit.py

      - name: Verify Protocol Installation Boundary
        run: |
          rm -rf /tmp/cpg-node-boundary-test
          python reference-implementation/node-installation/bootstrap_node.py /tmp/cpg-node-boundary-test
          python reference-implementation/node-installation/protocol_installation_boundary.py /tmp/cpg-node-boundary-test

      - name: Verify Release Integrity
        run: |
          python reference-implementation/node-installation/release_integrity.py .

      - name: Verify runtime readiness output
        run: |
          python reference-implementation/node-installation/node_runtime.py /tmp/cpg-node-test

      - name: Verify protocol isolation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("/tmp/cpg-node-test/node-installation-manifest.json")
          data = json.loads(p.read_text())
          data["protocol_associations"] = ["chain-poker-genesis"]
          p.write_text(json.dumps(data, indent=2))
          PY
          if python reference-implementation/node-installation/verify_node_installation.py /tmp/cpg-node-test; then
            echo "Protocol isolation test unexpectedly passed"
            exit 1
          fi

      - name: Verify Storage Manager
        run: |
          cd reference-implementation/node-installation
          python test_storage_manager.py

      - name: Verify Storage Coherence
        run: |
          python reference-implementation/node-installation/verify_storage_coherence.py /tmp/cpg-node-test

      - name: Verify Storage Provider
        run: |
          cd reference-implementation/node-installation
          python test_storage_provider.py

      - name: Verify Storage Locator
        run: |
          cd reference-implementation/node-installation
          python test_storage_locator.py

      - name: Verify Installation Manifest Schema
        run: |
          cd reference-implementation/node-installation
          python test_installation_manifest.py /tmp/cpg-node-test
          python validate_installation_manifest_schema.py /tmp/cpg-node-test

      - name: Verify Specification Coverage
        run: |
          cd reference-implementation/node-installation
          python test_specification_coverage.py

      - name: Verify Storage Policy Engine
        run: |
          cd reference-implementation/node-installation
          python test_storage_policy_engine.py

      - name: Verify Replication Policy Engine
        run: |
          cd reference-implementation/node-installation
          python test_replication_policy_engine.py

      - name: Verify FN-024 Identity Node networking substrate
        run: |
          cd reference-implementation/node-installation
          python test_identity_node_network.py

      - name: Verify FN-025 Capability Discovery
        run: |
          cd reference-implementation/node-installation
          python test_capability_discovery.py

      - name: Verify Object Registry
        run: |
          cd reference-implementation/node-installation
          python test_object_registry.py

      - name: Verify Synchronization State Machine
        run: |
          cd reference-implementation/node-installation
          python test_synchronization_state.py


      - name: Verify dual-storage manifest and object synchronization primitives
        run: |
          PYTHONPATH=reference-implementation/node-installation python -m unittest discover -s tests/node-installation -p "test_dual_storage_sync.py"
          PYTHONPATH=reference-implementation/node-installation python -m unittest discover -s tests/node-installation -p "test_dual_storage_object_sync.py"

      - name: Start pinned Kubo integration node
        run: |
          docker run -d --name cpg-kubo -p 5001:5001 ipfs/kubo:v0.43.1 daemon --api /ip4/0.0.0.0/tcp/5001
          for i in $(seq 1 30); do
            if curl --fail --silent -X POST "http://127.0.0.1:5001/api/v0/version" >/tmp/kubo-version.json; then
              cat /tmp/kubo-version.json
              break
            fi
            sleep 1
          done
          test -s /tmp/kubo-version.json

      - name: Verify real Kubo object synchronization
        run: |
          PYTHONPATH=reference-implementation/node-installation python - <<'PY'
          import hashlib
          import tempfile
          from pathlib import Path
          from object_registry import ObjectRegistry
          from storage_manager import StorageManager
          from dual_storage_bootstrap import initialize_local
          from dual_storage_object_sync import KuboObjectSync

          with tempfile.TemporaryDirectory() as directory:
              root = Path(directory)
              initialize_local(root)
              StorageManager(root).put_json("state", "ci-state-001", {"source": "real-kubo"})
              path = root / "node-storage/state/ci-state-001.json"
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              ObjectRegistry(root).register({
                  "object_id": "ci-state-001",
                  "object_class": "state",
                  "relative_path": "node-storage/state/ci-state-001.json",
                  "content_hash": digest,
                  "storage_version": "0.1.0",
                  "provider_type": "LOCAL",
                  "location_state": "SYNC_PENDING",
                  "object_state": "PRESENT",
                  "synchronization_state": "NOT_SYNCHRONIZED",
              })
              result = KuboObjectSync(root, "http://127.0.0.1:5001").synchronize("ci-state-001")
              assert result.content_hash == digest
              assert result.version == "0.1.0"
              assert result.cid.startswith(("Qm", "bafy"))
              assert result.location_state == "LOCAL_AND_DISTRIBUTED"
              assert result.synchronization_state == "SYNCHRONIZED"
              print(result)
          PY

      - name: Verify durable synchronization queue restart recovery against real Kubo
        run: |
          PYTHONPATH=reference-implementation/node-installation python - <<'PY'
          import hashlib
          import tempfile
          from pathlib import Path
          from object_registry import ObjectRegistry
          from storage_manager import StorageManager
          from dual_storage_bootstrap import initialize_local
          from dual_storage_object_sync import KuboObjectSync
          from synchronization_queue import DurableSynchronizationQueue

          with tempfile.TemporaryDirectory() as directory:
              root = Path(directory)
              initialize_local(root)
              StorageManager(root).put_json("state", "ci-restart-001", {"source": "durable-queue"})
              path = root / "node-storage/state/ci-restart-001.json"
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              ObjectRegistry(root).register({
                  "object_id": "ci-restart-001",
                  "object_class": "state",
                  "relative_path": "node-storage/state/ci-restart-001.json",
                  "content_hash": digest,
                  "storage_version": "0.1.0",
                  "provider_type": "LOCAL",
                  "location_state": "SYNC_PENDING",
                  "object_state": "PRESENT",
                  "synchronization_state": "NOT_SYNCHRONIZED",
              })

              first_process = DurableSynchronizationQueue(root)
              first_process.enqueue(
                  "ci-restart-001",
                  content_hash=digest,
                  storage_version="0.1.0",
              )
              first_process.mark_processing("ci-restart-001")

              restarted_process = DurableSynchronizationQueue(root)
              pending = restarted_process.pending()
              assert len(pending) == 1
              assert pending[0]["object_id"] == "ci-restart-001"
              assert pending[0]["status"] == "PENDING"

              results = KuboObjectSync(root, "http://127.0.0.1:5001").synchronize_pending()
              assert len(results) == 1
              assert results[0].object_id == "ci-restart-001"
              assert results[0].synchronization_state == "SYNCHRONIZED"
              assert DurableSynchronizationQueue(root).entries["ci-restart-001"]["status"] == "COMPLETED"
              persisted = ObjectRegistry(root).get("ci-restart-001")
              assert persisted["location_state"] == "LOCAL_AND_DISTRIBUTED"
              assert persisted["synchronization_state"] == "SYNCHRONIZED"
              print("durable synchronization queue restart recovery: PASS")
          PY

      - name: Verify synchronization retry backoff and circuit breaker
        run: |
          PYTHONPATH=reference-implementation/node-installation python -m unittest discover -s tests/node-installation -p "test_dual_storage_object_sync.py"

      - name: Stop Kubo integration node
        if: always()
        run: docker rm -f cpg-kubo || true
